name: Deploy — Backend

on:
  push:
    branches:
      - develop

env:
  # TODO: Update these with your actual Azure Resource Group and Container App names
  RESOURCE_GROUP: quest-log
  CONTAINER_APP_NAME: quest-log-api

jobs:
  build-and-deploy:
    name: Build, Test & Docker Build (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore QuestLog.slnx

      - name: Build
        run: dotnet build QuestLog.slnx --no-restore -c Release

      - name: Run tests
        run: dotnet test QuestLog.slnx --no-build -c Release --verbosity normal

      - name: Build Docker image
        run: docker build -t questlog-backend:${{ github.sha }} -t questlog-backend:latest .

      # ─────────────────────────────────────────────────────────────────────────
      # Azure Container Apps Deployment
      # ─────────────────────────────────────────────────────────────────────────
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR
        run: |
          docker tag questlog-backend:latest ${{ secrets.ACR_LOGIN_SERVER }}/questlog-backend:latest
          docker tag questlog-backend:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/questlog-backend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/questlog-backend:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/questlog-backend:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/questlog-backend:${{ github.sha }}
